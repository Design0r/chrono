<!DOCTYPE html>
<html data-theme="custom" lang="en" class="bg-base-200">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Chrono">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#12161f">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Internes Tool: robots.txt verbietet das Crawlen, dieser Tag zusätzlich
       das Indexieren, falls die URL anderweitig bekannt wird. -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>Chrono</title>
  <style>
    .max-lg\:dock::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<!-- pt: black-translucent + viewport-fit=cover zeichnen die App unter die
     Statusbar/Notch. Die Safe-Area oben bleibt so frei, in Browsern ist der
     Inset 0 und die Darstellung unverändert. -->

<body class="overflow-x-hidden pt-[env(safe-area-inset-top,0px)]">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
