server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Kompression: ohne diese Direktiven liefert nginx alles unkomprimiert aus
  # (Default ist "gzip off"). Das Haupt-Bundle sind ~328 KB JS + ~152 KB CSS,
  # die damit roh über die Leitung gingen – gzip drückt das auf rund ein Viertel
  # und ist der grösste Hebel für FCP/LCP.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    application/xml
    text/xml;

  # Vite hängt an jedes Asset einen Content-Hash. Der Dateiname ändert sich also
  # bei jedem Deploy – die Dateien selbst dürfen darum unbegrenzt gecacht werden.
  # Kein "expires" hier: die Direktive setzt selbst schon ein Cache-Control und
  # zusammen mit add_header ginge der Header doppelt raus.
  # "^~" ist wichtig: ohne den Modifier würde der Regex-Block weiter unten
  # gewinnen (Regex schlägt Prefix) und gehashte Bilder/Fonts unter /assets/
  # bekämen nur 7 Tage statt einem Jahr.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  # Icons, Logo, Manifest liegen ohne Hash im Root. Eine Woche Cache mit
  # Revalidierung, damit ein ausgetauschtes Logo nicht ein Jahr lang hängt.
  location ~* \.(?:svg|png|ico|webmanifest|woff2?)$ {
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    access_log off;
  }

  # index.html ist der Einstiegspunkt und verweist auf die gehashten Assets.
  # Sie darf nie aus dem Cache kommen, sonst zeigt der Browser nach einem Deploy
  # weiter auf verschwundene Chunks.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
